name: Lock daily game

on:
  schedule:
    # A second invocation is safe: the lock script leaves an existing queue
    # untouched. It recovers the day if the first hosted runner has a
    # transient failure.
    - cron: "5,35 0 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "UTC date to lock, YYYY-MM-DD. Defaults to today."
        required: false
        type: string
      force:
        description: "Replace an existing locked queue. Use only for corrections."
        required: false
        default: false
        type: boolean

concurrency:
  group: lock-daily-${{ github.event.inputs.date || github.run_id }}
  cancel-in-progress: false

jobs:
  lock:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: |
          # GitHub-hosted runners occasionally fail while unpacking a package.
          # A retry keeps a transient registry/cache error from leaving the
          # current day's game unlocked.
          for attempt in 1 2 3; do
            bun install --frozen-lockfile && exit 0
            if [ "$attempt" -lt 3 ]; then
              echo "Install failed (attempt $attempt/3); retrying in 10 seconds..."
              sleep 10
            fi
          done

          exit 1

      - name: Lock daily game
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          force_flag=""
          if [ "${{ inputs.force }}" = "true" ]; then
            force_flag="--force"
          fi

          if [ -n "${{ github.event.inputs.date }}" ]; then
            bun run daily:lock --date=${{ github.event.inputs.date }} $force_flag
          else
            bun run daily:lock $force_flag
          fi
